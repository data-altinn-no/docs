{{- /* Site search powered by Pagefind. The index (/pagefind/) is built from the finished HTML in the
      deploy workflow, so it is absent in local `hugo server` builds; the box then explains that. */ -}}
<div id="search" class="site-search" data-pagefind-ignore>
  <link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}">
  <div id="search-ui"></div>
  <p id="search-unavailable" class="site-search__unavailable" hidden>Søk er bare tilgjengelig på den publiserte nettsiden.</p>
</div>
<script src="{{ "pagefind/pagefind-ui.js" | relURL }}" onerror="document.getElementById('search-unavailable').hidden=false"></script>
<script>
  window.addEventListener('DOMContentLoaded', function () {
    if (!window.PagefindUI) return;
    new PagefindUI({
      element: "#search-ui",
      bundlePath: {{ "pagefind/" | relURL }},
      showImages: false,
      showSubResults: false,
      excerptLength: 12,
      pageSize: 5,
      translations: {
        placeholder: "Søk",
        clear_search: "Tøm",
        load_more: "Vis flere treff",
        search_label: "Søk i dokumentasjonen",
        filters_label: "Filtre",
        zero_results: "Ingen treff for [SEARCH_TERM]",
        many_results: "[COUNT] treff for [SEARCH_TERM]",
        one_result: "[COUNT] treff for [SEARCH_TERM]",
        alt_search: "Ingen treff for [SEARCH_TERM]. Viser treff for [DIFFERENT_TERM] i stedet",
        search_suggestion: "Ingen treff for [SEARCH_TERM]. Prøv ett av følgende søk:",
        searching: "Søker etter [SEARCH_TERM] ..."
      }
    });

    // Pagefind only searches on `input` events. Two cases need a nudge:
    //  - the browser restores the previous term when you navigate back, but no results are shown;
    //  - pressing Enter on an already typed term does nothing.
    var input = document.querySelector('#search-ui input');
    if (!input) return;
    var rerun = function () {
      if (input.value.trim()) input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    window.addEventListener('pageshow', rerun);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); rerun(); }
    });
  });
</script>
