baseURL = "https://docs.data.altinn.no/"
locale = "nb-no"
defaultContentLanguage = "nb-no"

contentDir = "content"
staticDir = "static"
publishDir = "public"

title = "Altinn docs"
theme = "hugo-theme-altinn"
metadataFormat = "yaml"
pluralizeListTitles = false
preservetaxonomynames = true
enableEmoji = true
enableGitInfo = false
disableKinds = ["RSS", "taxonomy", "term"] # page home section taxonomy taxonomyTerm RSS sitemap robotsTXT 404

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = "dracula"

[markup.tableOfContents]
startLevel = 2
endLevel = 2
ordered = false

[params]
description = "Teknisk dokumentasjon for data.altinn.no (DAN): API, datasett, samtykke og tjenester for deling av data fra virksomheter."
editURL = ""
noHomeIcon = true # default is false
noSearch = false # default is false
disableNavChevron = false
showVisitedLinks = false # default is false
# themeVariant = "gray" # choose theme variant "gray" for systemdocumentation, like Altinnpedia. Blue theme is for altinndigitalisering.

[related]
includeNewer = true # Excluding newer content is not relevant for our site.
threshold = 80 # Range 0-100 
toLower = false
[[related.indices]]
name = 'keywords'
weight = 100
toLower = true
[[related.indices]]
name = 'tags' # Tags are included by default with weight 80, as long as tags are set up as a taxonomy.
weight = 80
