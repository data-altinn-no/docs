name: Link check

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**"
      - "CONTRIBUTING.md"
      - "README.md"

permissions:
  contents: read

env:
  HUGO_VERSION: 0.166.0 # keep in sync with the deploy workflow

jobs:
  lychee:
    name: Check links in content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Hugo
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSLf -o "${tarball}" "${base}/${tarball}"
          curl -sSLf -o checksums.txt "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          mkdir -p hugo-bin
          tar -xzf "${tarball}" -C hugo-bin hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Build site (so root-relative links can be resolved)
        run: hugo --quiet

      - name: Run lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          fail: true
          # 401/403/429: authenticated API endpoints and bot-blocking sites are not broken links.
          # Excluded hosts are placeholder examples used in code blocks.
          args: >-
            --no-progress
            --timeout 20
            --max-retries 2
            --accept "200..=206,401,403,429"
            --root-dir public
            --exclude "^https?://api\.(bestetilsynsmyndighet|navn|annenbank|enbank)\.no"
            --exclude "^https?://(test-)?api\.data\.altinn\.no/v1/directharvest"
            --exclude "localhost"
            "content/**/*.md"
            CONTRIBUTING.md
            README.md
