name: Azure Static Web Apps CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

permissions:
  contents: read
  pull-requests: write

env:
  # Hugo is built here on the GitHub runner rather than by Oryx inside the
  # Static Web Apps action: Oryx's build image ships an old glibc that cannot
  # run Hugo binaries from 0.150 onwards.
  HUGO_VERSION: 0.166.0

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so Hugo can show "last updated" from git

      - name: Install Hugo
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "${RUNNER_TEMP}"
          curl -sSLf -o "${tarball}" "${base}/${tarball}"
          curl -sSLf -o checksums.txt "${base}/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" checksums.txt | sha256sum -c -
          mkdir -p hugo-bin
          tar -xzf "${tarball}" -C hugo-bin hugo
          echo "${RUNNER_TEMP}/hugo-bin" >> "${GITHUB_PATH}"

      - name: Build site
        run: |
          hugo version
          hugo --printPathWarnings

      - name: Build search index (Pagefind)
        # Indexes the finished HTML into public/pagefind/. Only elements inside [data-pagefind-body]
        # are indexed (the page content), minus the selectors below.
        run: >-
          npx --yes pagefind@1.5.2 --site public --force-language nb
          --exclude-selectors "#TableOfContents, .footline, #breadcrumbs, .evidenceCodeEnvToggler"

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_MUSHROOM_02ABE3903 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          skip_app_build: true
          app_location: "public" # Already-built site from the step above
          api_location: ""
          output_location: ""

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_MUSHROOM_02ABE3903 }}
          action: "close"
